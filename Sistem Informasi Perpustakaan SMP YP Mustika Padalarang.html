<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sistem Informasi Perpustakaan SMP YP Mustika Padalarang</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#172B4D;--teal:#168C83;--gold:#F0B85A;--bg:#F8F6F0;--card:#fff;--tx:#1d2733;--mu:#6b7686;--bd:#e4e0d6;--in:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10182a;--card:#1b2740;--tx:#eef1f6;--mu:#9aa6ba;--bd:#2c3a58;--in:#142038;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10182a;--card:#1b2740;--tx:#eef1f6;--mu:#9aa6ba;--bd:#2c3a58;--in:#142038;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{font-family:Inter,Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;background-color:var(--bg)}
h1,h2,h3,h4{margin:0}.mu{color:var(--mu)}
.b{font:inherit;font-weight:500;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;transition:.15s}
.b:hover{border-color:var(--teal);color:var(--teal)}.b.p{background:var(--teal);border-color:var(--teal);color:#fff}.b.p:hover{opacity:.9;color:#fff}.b.d{color:#c0392b}.b.s{padding:3px 9px;font-size:12px;border-radius:8px}
.sh{display:flex;min-height:100vh}aside{width:250px;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;padding:16px 10px;transition:transform .2s;z-index:20}
.id{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;margin-bottom:10px}.id img{width:44px;height:44px;object-fit:contain}.id b{font-size:15px;letter-spacing:.08em;display:block}.id small{font-size:11px;font-weight:700;letter-spacing:.08em;line-height:1.3;display:block;color:#dbe3f2}
aside button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:#c3cde0;font:inherit;font-size:13.5px;font-weight:500;padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}aside button svg{flex-shrink:0;opacity:.85}aside button:hover{background:#ffffff12}aside button.a{background:#2b4168;color:#fff;font-weight:700;border-left-color:var(--gold)}
.mn{flex:1;min-width:0}.tp{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;flex-wrap:wrap}.tp h1{font-size:16px;flex:1;min-width:120px}.hb{display:none}.st{font-size:12px;color:var(--teal);font-weight:500}.st.w{color:#c0392b}
main{padding:20px;max-width:1200px;animation:f .25s}@keyframes f{from{opacity:0}to{opacity:1}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar h2{font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #172b4d10}.card2{margin-top:14px}
.sg8{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;border-left:5px solid var(--teal);box-shadow:0 2px 10px #172b4d10}.sc:nth-child(even){border-left-color:var(--gold)}.sc b{font-size:26px;display:block;color:var(--navy)}@media(prefers-color-scheme:dark){.sc b{color:#fff}}.sc span{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500}.w2{grid-column:1/-1}.rq{color:#c0392b}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--teal)}
.fa{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.er{color:#c0392b;font-weight:500;grid-column:1/-1}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tb input{flex:1;min-width:180px;width:auto}.tb select{width:auto;flex:1;min-width:140px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips span{background:var(--bg);border:1px solid var(--bd);padding:4px 12px;border-radius:99px;font-size:12px}
.ts{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{background:var(--navy);color:#fff;white-space:nowrap;cursor:pointer;font-weight:500}tfoot td{font-weight:700}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.kc{margin:0}.kc h4{color:var(--teal);margin-bottom:6px}.kc p{margin:4px 0}.kc small{display:block;color:var(--mu);font-size:11px}
.br{display:flex;flex-direction:column;gap:6px}.bi{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;font-size:12px}.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}.bt i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .4s}.bi:nth-child(even) .bt i{background:var(--gold)}.bi b{text-align:right}
ul.ls{list-style:none;margin:0;padding:0}ul.ls li{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}details summary{cursor:pointer;font-weight:600;margin:6px 0}
#wl{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.wl1{background:var(--navy);color:#fff;padding:24px 28px 32px;display:flex;flex-direction:column;gap:24px;overflow:hidden}.wb{display:flex;gap:10px;align-items:center;letter-spacing:.1em;font-size:14px}.wb svg{color:var(--gold)}.ill{position:relative;margin:auto;width:min(460px,86%)}.shf{background:#c4956a;border-radius:12px;padding:14px;box-shadow:18px 18px 0 #0f1d38}.rw{background:#215c64;height:72px;margin-bottom:12px}.rw+.rw{height:140px;margin:0;display:flex;justify-content:space-around;align-items:center;font-size:52px;border-top:12px solid #c4956a}.ch{position:absolute;left:-30px;bottom:-14px;font-size:64px}.wt h2{font-size:clamp(18px,2.4vw,26px);line-height:1.3;font-weight:600}.wt p{margin:6px 0 0;font-weight:600;font-size:17px}.wl2{background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,6vw,90px);gap:14px}.wl2 .lg{display:flex;gap:14px;align-items:center}.wl2 img{height:64px;max-width:30vw;object-fit:contain}.eb{color:var(--teal);font-weight:700;letter-spacing:.16em;font-size:12px}.wl2 h1{font-size:clamp(38px,5.6vw,72px);line-height:1.05;font-weight:800;color:var(--navy)}.wl2 p{color:var(--mu);font-size:18px;margin:0;max-width:440px}.sn{letter-spacing:.14em;color:var(--mu);font-size:16px;margin-top:10px}.go{display:inline-flex;gap:10px;align-items:center;align-self:flex-start;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:16px 26px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px}.go:hover{opacity:.9}@media(prefers-color-scheme:dark){.wl2 h1{color:#fff}}@media(max-width:800px){#wl{grid-template-columns:1fr}.wl1{min-height:60vh}.ch{left:-8px}}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}.mb{background:var(--card);padding:20px;border-radius:16px;max-width:420px;width:100%}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 16px;border-radius:12px;color:#fff;z-index:100;max-width:90vw}.toast.ok{background:var(--teal)}.toast.er{background:#c0392b}
#pa{display:none}.kop{display:flex;gap:14px;align-items:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:10px}.kop img{height:70px}.kop div{flex:1;text-align:center}.sgn{display:flex;justify-content:space-between;margin-top:30px}.sgn div{text-align:center;min-width:180px}
@media(max-width:900px){aside{position:fixed;left:0;transform:translateX(-100%)}aside.open{transform:none}.hb{display:inline-block}main{padding:14px}.bi{grid-template-columns:80px 1fr 48px}}
@media print{body>*:not(#pa){display:none!important}#pa{display:block!important;color:#000;background:#fff;font-size:12px}#pa table{border:1px solid #000}#pa th,#pa td{border:1px solid #000;color:#000;background:#fff;padding:4px 6px}#pa th{font-weight:700}}
</style></head><body>

function draw(){const w=S.p=='welcome',s=DB.set;$('#wl').hidden=!w;$('#sh').hidden=w;
if(w){$('#wl').innerHTML=`<div class="wl1"><div class="wb">${ic('buku')}<b>DIGITAL LIBRARY</b></div><div class="ill"><div class="shf"><div class="rw"></div><div class="rw"><span>📚</span><span>📖</span><span>📚</span></div></div><span class="ch">🪑</span></div><div class="wt"><h2>${esc(s.perpus).toUpperCase()}</h2><p>A Place to Read, Learn, and Grow</p></div></div><div class="wl2"><div class="lg"><img src="${s.logoS||LOGO}" alt="Logo sekolah"><img src="${KAB}" alt="Logo kabupaten">${s.logoP?`<img src="${s.logoP}" alt="Logo perpustakaan">`:''}</div><span class="eb">SISTEM ADMINISTRASI PERPUSTAKAAN SEKOLAH</span><h1>Welcome to Our Library!</h1><p>Manage, Organize, and Explore Your Library Collection in One Place.</p><b class="sn">${esc(s.sekolah).toUpperCase()}</b><button class="go" onclick="go('dash')">MASUK KE DASHBOARD ${ic('arrow')}</button></div>`;return}
$('#sb').innerHTML=`<div class="id"><img src="${s.logoS||LOGO}" alt=""><div><b>PERPUSTAKAAN</b><small>${esc(s.sekolah).toUpperCase()}</small></div></div>`+NAV.map(([id,l])=>`<button class="${S.p==id?'a':''}" onclick="go('${id}')">${ic(id)}<span>${l}</span></button>`).join('')+`<button onclick="go('welcome')">${ic('out')}<span>Halaman Pembuka</span></button>`;
$('#ttl').textContent=(NAV.find(n=>n[0]==S.p)||[])[1];$('#bkb').hidden=S.p=='dash';
$('#mn').innerHTML=S.p=='dash'?dash():S.p=='rekap'?rekap():S.p=='ang'?ang():S.p=='set'?setp():mod(S.p);
if(MODS[S.p])dt();stat();window.scrollTo(0,0)}
// ===== Bagan sederhana =====
function bars(a){const mx=Math.max(1,...a.map(x=>x[1]));return a.length?`<div class="br">${a.map(([l,v])=>`<div class="bi"><span class="bl" title="${esc(l)}">${esc(l)}</span><div class="bt"><i style="width:${v/mx*100}%"></i></div><b>${nm(v)}</b></div>`).join('')}</div>`:'<p class="mu">Belum ada data.</p>'}
// ===== Dashboard =====
function dash(){const B=rows('buku'),kv=rows('kunjungan'),pm=rows('pemanfaatan'),s=DB.set;
const C=[['Total Judul Buku',B.length,'📖'],['Total Eksemplar Buku',sm(B,'jumlah'),'📚'],['Total Jenis Koleksi',new Set(B.map(x=>x.jenis)).size,'🗂️'],['Total Tenaga Perpustakaan',rows('tenaga').length,'👥'],['Total Kegiatan Literasi',rows('literasi').length,'🎉'],['Total Kunjungan',sm(kv,'jumlah'),'🚶'],['Total Pengguna Fasilitas TIK',sm(rows('tik'),'jumlah'),'💻'],['Total Koleksi Dimanfaatkan',sm(pm,'dipinjam')+sm(pm,'dibaca'),'🔖']];
const g=gp(B,x=>x.jenis),kb=gp(kv,x=>x.bulan),lt=[...gp(rows('literasi'),x=>(x.tgl||'').slice(0,7))].filter(a=>a[0]).sort();
return `<div class="sg8">${C.map(c=>`<div class="sc"><span>${c[2]} ${c[0]}</span><b>${nm(c[1])}</b></div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Koleksi menurut jenis (eksemplar)</h3>${bars(JENIS.map(j=>[j,sm(g.get(j)||[],'jumlah')]))}</div>
<div class="card"><h3>Kunjungan per bulan</h3>${bars(BL.map(b=>[b,sm(kb.get(b)||[],'jumlah')]))}</div>
<div class="card"><h3>Kegiatan literasi per bulan</h3>${bars(lt.map(([k,v])=>[BL[+k.slice(5)-1]+' '+k.slice(0,4),v.length]))}</div>
<div class="card"><h3>Penambahan koleksi terbaru</h3><ul class="ls">${B.slice(-5).reverse().map(x=>`<li><b>${esc(x.judul)}</b><br><span class="mu">${nm(x.jumlah)} eks. - ${esc(x.asal)} - ${fd(x.tgl)}</span></li>`).join('')||'<li class="mu">Belum ada data.</li>'}</ul></div>
<div class="card"><h3>Aktivitas terbaru</h3><ul class="ls">${DB.log.map(l=>`<li>${esc(l.m)}<br><span class="mu">${new Date(l.t).toLocaleString('id-ID')}</span></li>`).join('')||'<li class="mu">Belum ada aktivitas.</li>'}</ul></div>
<div class="card"><h3>Identitas perpustakaan</h3><ul class="ls"><li>Sekolah: <b>${esc(s.sekolah)}</b></li><li>Perpustakaan: <b>${esc(s.perpus)}</b></li><li>Alamat: ${esc(s.alamat)||'-'}</li><li>Kepala Sekolah: ${esc(s.kepsek)||'-'}</li><li>Petugas Perpustakaan: ${esc(s.petugas)||'-'}</li></ul></div></div>`}
// ===== Modul CRUD generik =====
function opts(m,k){const f=MODS[m].f.find(f=>f[0]==k);return f[3]||[...new Set(rows(m).map(x=>x[k]).filter(v=>v!==''&&v!=null))].sort()}
function mod(m){const M=MODS[m];return `<div class="bar"><h2>${M.t}</h2><div class="fa"><button class="b p" onclick="nf()">＋ Tambah Data</button><button class="b" onclick="prm('${m}')">🖨 Cetak</button><button class="b" onclick="csv()">Salin CSV</button></div></div><div id="fm"></div>
<div class="card"><div class="tb">${M.s.length?`<input id="q" placeholder="Cari..." oninput="S.q=this.value;dt()" value="${esc(S.q)}">`:''}${(M.fl||[]).map(k=>`<select onchange="S.fl['${k}']=this.value;dt()"><option value="">Semua ${lb(M,k)}</option>${opts(m,k).map(o=>`<option ${S.fl[k]==o?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('')}</div><div id="tbl"></div></div>`}
function filt(m){const M=MODS[m],q=S.q.toLowerCase();let r=rows(m).filter(x=>(!q||M.s.some(k=>String(x[k]||'').toLowerCase().includes(q)))&&Object.keys(S.fl).every(k=>!S.fl[k]||String(x[k])===S.fl[k]));
const v=(x,k)=>k=='bulan'?BL.indexOf(x[k]):x[k];
if(S.sort){const{k,d}=S.sort;r.sort((a,b)=>{const A=v(a,k),B=v(b,k);return d*(typeof A=='number'&&typeof B=='number'?A-B:String(A).localeCompare(String(B),'id',{numeric:true}))})}
else if(M.f.some(f=>f[0]=='bulan'))r.sort((a,b)=>a.tahun-b.tahun||BL.indexOf(a.bulan)-BL.indexOf(b.bulan));else if(M.cards)r.sort((a,b)=>String(b.tgl||'').localeCompare(String(a.tgl||'')));return r}
function so(k){S.sort=S.sort&&S.sort.k==k?{k,d:-S.sort.d}:{k,d:1};dt()}
function cl(M,k,x,pr){const v=x[k],f=M.f.find(f=>f[0]==k);if(f[2]=='url')return v?(pr?esc(v):`<a class="b s" href="${esc(v)}" target="_blank" rel="noopener">Buka Link</a> <button class="b s" data-u="${esc(v)}" onclick="cp(this.dataset.u)">Salin Link</button>`):`<i class="mu">${M.nl||'Belum ada dokumentasi'}</i>`;if(k=='harga')return rp(v);if(f[2]=='date')return fd(v);if(f[2]=='number')return k=='tahun'?esc(v):nm(v);return esc(v)||'-'}
function sumh(m,r){const M=MODS[m];let h=`<div class="chips"><span>Jumlah data: <b>${r.length}</b></span>`;
if(m=='buku')h+=`<span>Total judul: <b>${r.length}</b></span><span>Total eksemplar: <b>${nm(sm(r,'jumlah'))}</b></span>`;
(M.sum||[]).forEach(k=>h+=`<span>Total ${lb(M,k)}: <b>${nm(sm(r,k))}</b></span>`);h+='</div>';
if(M.rk&&r.length)h+=`<details open><summary>Rekap per ${M.rk}</summary><div class="ts"><table><tr><th>${M.rk=='tahun'?'Tahun':'Nama'}</th><th>Jumlah data</th>${M.sum.map(k=>`<th>${lb(M,k)}</th>`).join('')}</tr>${[...gp(r,x=>x[M.rk])].sort().map(([a,b])=>`<tr><td>${esc(a)}</td><td>${b.length}</td>${M.sum.map(k=>`<td>${nm(sm(b,k))}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
if(M.chart){const g=gp(r,x=>x.bulan);M.sum.forEach(k=>h+=`<div style="margin:10px 0"><h4>Grafik ${lb(M,k)} per bulan</h4>${bars(BL.map(b=>[b,sm(g.get(b)||[],k)]))}</div>`)}return h}
function dt(){const m=S.p,M=MODS[m],r=filt(m);let h=sumh(m,r);
if(!r.length)h+='<p class="mu">Belum ada data. Klik "Tambah Data" untuk mulai.</p>';
else if(M.cards)h+=`<div class="cg">${r.map(x=>`<div class="card kc"><h4>${esc(x[M.cols[0]])}</h4>${M.cols.slice(1).map(k=>`<p><small>${lb(M,k)}</small>${cl(M,k,x)}</p>`).join('')}<div class="fa" style="margin-top:8px"><button class="b s" onclick="nf('${x.id}')">✎ Edit</button><button class="b s d" onclick="del('${x.id}')">🗑 Hapus</button></div></div>`).join('')}</div>`;
else h+=`<div class="ts"><table><tr><th>No</th>${M.cols.map(k=>`<th onclick="so('${k}')">${lb(M,k)}${S.sort&&S.sort.k==k?(S.sort.d>0?' ▲':' ▼'):''}</th>`).join('')}<th>Aksi</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td>${M.cols.map(k=>`<td>${cl(M,k,x)}</td>`).join('')}<td style="white-space:nowrap"><button class="b s" onclick="nf('${x.id}')">✎ Edit</button> <button class="b s d" onclick="del('${x.id}')">🗑 Hapus</button></td></tr>`).join('')}</table></div>`;
$('#tbl').innerHTML=h}
function fld([k,l,t,o,r],v){const n=`name="${k}" ${r?'required':''}`;let i;
if(t=='select')i=`<select ${n}><option value="">Pilih...</option>${o.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
else if(t=='textarea')i=`<textarea ${n} rows="3">${esc(v)}</textarea>`;
else i=`<input ${n} type="${t=='tn'||t=='url'?'text':t}" value="${esc(v)}" ${t=='number'?'min="0" step="any" inputmode="decimal"':''} ${t=='tn'?'list="tnl"':''} ${t=='url'?'placeholder="https://..."':''}>`;
return `<label class="${t=='textarea'?'w2':''}">${l}${r?' <b class="rq">*</b>':''}${i}</label>`}
function nf(id){S.edit=id||null;const M=MODS[S.p],r=id?rows(S.p).find(x=>x.id===id):{};
$('#fm').innerHTML=`<div class="card"><h3 style="margin-bottom:10px">${id?'Edit':'Tambah'} Data</h3><form class="fg" onsubmit="return sv(event)" novalidate>${M.f.map(f=>fld(f,r[f[0]]??'')).join('')}<datalist id="tnl">${rows('tenaga').map(x=>`<option value="${esc(x.nama)}">`).join('')}</datalist><div class="er" id="er"></div><div class="fa"><button class="b p">💾 Simpan</button><button type="button" class="b" onclick="cf()">Batal</button></div></form></div>`;$('#fm').scrollIntoView({behavior:'smooth'})}
const cf=()=>{$('#fm').innerHTML='';S.edit=null},er=t=>{$('#er').textContent='⚠ '+t;return false};
function sv(e){e.preventDefault();const m=S.p,M=MODS[m],F=new FormData(e.target),rec={};
for(const f of M.f){let v=(F.get(f[0])||'').trim();if(f[4]&&v==='')return er(f[1]+' wajib diisi');
if(f[2]=='number'&&v!==''){v=+v;if(isNaN(v)||v<0)return er(f[1]+' harus berupa angka 0 atau lebih')}
if(f[2]=='url'&&v&&!vu(v))return er(f[1]+' bukan URL yang valid. Awali dengan http:// atau https://');rec[f[0]]=v}
if(m=='buku'&&rec.jumlah<1)return er('Jumlah eksemplar minimal 1');
for(const u of M.u||[]){if(u.some(k=>rec[k]===''))continue;if(rows(m).some(x=>x.id!==S.edit&&u.every(k=>String(x[k]).toLowerCase()==String(rec[k]).toLowerCase())))return er(u.map(k=>lb(M,k)).join(' + ')+' sudah tercatat. Gunakan Edit pada data yang ada (tidak boleh ganda)')}
const nmx=Object.values(rec).slice(0,2).filter(Boolean).join(' ');
const ok=tx(()=>{const a=rows(m);if(S.edit){const i=a.findIndex(x=>x.id===S.edit);a[i]={...a[i],...rec}}else a.push({id:uid(),...rec});lg((S.edit?'Mengubah ':'Menambah ')+M.t+': '+nmx)});
if(!ok)return er('GAGAL menyimpan ke penyimpanan browser. Data belum tersimpan. Isian Anda tidak dihapus.');
toast('Data berhasil disimpan dan terverifikasi');cf();dt();stat();return false}
function del(id){const m=S.p;cfm('Hapus data ini? Tindakan tidak dapat dibatalkan.',()=>{const ok=tx(()=>{DB.d[m]=rows(m).filter(x=>x.id!==id);lg('Menghapus data '+MODS[m].t)});toast(ok?'Data dihapus':'Gagal menghapus data',ok);dt();stat()})}
function csv(){const M=MODS[S.p],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';cp([M.f.map(f=>q(f[1])).join(','),...filt(S.p).map(x=>M.f.map(f=>q(x[f[0]])).join(','))].join('\n'))}
// ===== Rekap dan anggaran =====
function rkt(){const B=rows('buku');let tj=0,te=0;const b=JENIS.map((j,i)=>{const r=B.filter(x=>x.jenis==j),e=sm(r,'jumlah');tj+=r.length;te+=e;return `<tr><td>${i+1}</td><td>${j}</td><td>${r.length}</td><td>${nm(e)}</td></tr>`}).join('');
return `<table><tr><th>Nomor</th><th>Jenis Koleksi</th><th>Jumlah Judul</th><th>Jumlah Eksemplar</th></tr>${b}<tfoot><tr><td></td><td>TOTAL</td><td>${tj}</td><td>${nm(te)}</td></tr></tfoot></table>`}
function rekap(){return `<div class="bar"><h2>Rekapitulasi Koleksi</h2><button class="b" onclick="pr('Rekapitulasi Koleksi',rkt())">🖨 Cetak</button></div><div class="card"><p class="mu">Dihitung otomatis dari Buku Induk.</p><div class="ts">${rkt()}</div></div>`}
function agd(){const kf={tahun:x=>(x.tgl||'').slice(0,4)||'-',jenis:x=>x.jenis,asal:x=>x.asal},g=[...gp(rows('buku'),kf[S.gb])].sort();let a=0,e=0,n=0;const it=g.map(([k,r])=>{const v=r.reduce((s,x)=>s+(+x.harga||0)*(+x.jumlah||0),0),ex=sm(r,'jumlah');a+=r.length;e+=ex;n+=v;return[k,r.length,ex,v]});
return{it,html:`<table><tr><th>${{tahun:'Tahun Penerimaan',jenis:'Jenis Koleksi',asal:'Asal Perolehan'}[S.gb]}</th><th>Jumlah Judul</th><th>Jumlah Eksemplar</th><th>Total Nilai Perolehan</th></tr>${it.map(i=>`<tr><td>${esc(i[0])}</td><td>${i[1]}</td><td>${nm(i[2])}</td><td>${rp(i[3])}</td></tr>`).join('')}<tfoot><tr><td>TOTAL</td><td>${a}</td><td>${nm(e)}</td><td>${rp(n)}</td></tr></tfoot></table>`}}
function ang(){const d=agd();return `<div class="bar"><h2>Penambahan Koleksi dan Anggaran</h2><div class="fa"><select style="width:auto" onchange="S.gb=this.value;draw()"><option value="jenis">Kelompokkan: Jenis Koleksi</option><option value="tahun" ${S.gb=='tahun'?'selected':''}>Kelompokkan: Tahun</option><option value="asal" ${S.gb=='asal'?'selected':''}>Kelompokkan: Asal Perolehan</option></select><button class="b" onclick="pr('Penambahan Koleksi dan Anggaran',agd().html)">🖨 Cetak</button></div></div><div class="card"><p class="mu">Nilai = harga perolehan x jumlah eksemplar, dari Buku Induk.</p><div class="ts">${d.html}</div></div><div class="card"><h3>Grafik nilai perolehan (Rp)</h3>${bars(d.it.map(i=>[i[0],i[3]]))}</div>`}
// ===== Cetak =====
function kop(){const s=DB.set;return `<div class="kop"><img src="${s.logoS||LOGO}"><div><b style="font-size:15px">${esc(s.sekolah)}</b><br><b>${esc(s.perpus)}</b><br>${esc(s.alamat)}</div>${s.logoP?`<img src="${s.logoP}">`:'<span style="width:70px"></span>'}</div>`}
function pr(t,h){const s=DB.set;$('#pa').innerHTML=kop()+`<h3 style="text-align:center;margin:8px 0">${t}</h3>`+h+`<div class="sgn"><div>Mengetahui,<br>Kepala Sekolah<br><br><br><br><u>${esc(s.kepsek)||'..................'}</u></div><div>Padalarang, ${new Date().toLocaleDateString('id-ID',{dateStyle:'long'})}<br>Petugas Perpustakaan<br><br><br><br><u>${esc(s.petugas)||'..................'}</u></div></div>`;window.print()}
function prm(m){const M=MODS[m],r=filt(m);let f='';if(M.sum)f=`<tfoot><tr><td colspan="${M.cols.length+1}">${M.sum.map(k=>'Total '+lb(M,k)+': '+nm(sm(r,k))).join(' | ')}</td></tr></tfoot>`;if(m=='buku')f=`<tfoot><tr><td colspan="${M.cols.length+1}">Total judul: ${r.length} | Total eksemplar: ${nm(sm(r,'jumlah'))}</td></tr></tfoot>`;
pr(M.t,`<table><tr><th>No</th>${M.cols.map(k=>`<th>${lb(M,k)}</th>`).join('')}</tr>${r.map((x,i)=>`<tr><td>${i+1}</td>${M.cols.map(k=>`<td>${cl(M,k,x,1)}</td>`).join('')}</tr>`).join('')}${f}</table>`)}
// ===== Pengaturan, cadangan =====
let PL={};
function setp(){const s=DB.set,I=(k,l)=>`<label>${l}<input name="${k}" value="${esc(s[k])}"></label>`;
return `<div class="card"><h3 style="margin-bottom:10px">Identitas sekolah dan perpustakaan</h3><form class="fg" onsubmit="return ss(event)">${I('sekolah','Nama Sekolah')}${I('perpus','Nama Perpustakaan')}${I('alamat','Alamat Sekolah')}${I('kepsek','Nama Kepala Sekolah')}${I('petugas','Nama Kepala/Petugas Perpustakaan')}
<label>Logo Sekolah<input type="file" accept="image/*" onchange="lf(this,'logoS')"><img id="pvlogoS" src="${s.logoS||LOGO}" style="height:60px;object-fit:contain;align-self:flex-start"></label>
<label>Logo Perpustakaan<input type="file" accept="image/*" onchange="lf(this,'logoP')"><img id="pvlogoP" src="${s.logoP}" style="height:60px;object-fit:contain;align-self:flex-start" ${s.logoP?'':'hidden'}></label>
<div class="fa"><button class="b p">💾 Simpan Pengaturan</button><button type="button" class="b" onclick="clr('logoS')">Logo sekolah bawaan</button><button type="button" class="b" onclick="clr('logoP')">Hapus logo perpustakaan</button></div></form></div>
<div class="card"><h3>Cadangan dan pemulihan data</h3><p class="mu">Data tersimpan di browser perangkat ini saja (tidak otomatis sinkron antarperangkat). Unduh file tidak tersedia di halaman ini, jadi cadangan dibuat sebagai teks: salin lalu simpan di Notes/Drive. Untuk memulihkan, tempel teksnya lalu tekan Pulihkan.</p><textarea id="bx" rows="6" placeholder="Teks cadangan muncul di sini"></textarea><div class="fa" style="margin-top:8px"><button class="b p" onclick="bk()">Buat cadangan</button><button class="b" onclick="cp($('#bx').value)">Salin teks</button><button class="b" onclick="rs()">Pulihkan dari teks</button><button class="b d" onclick="ra()">Hapus semua data</button></div></div>`}
function lf(inp,k){const f=inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('File harus berupa gambar',0);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=Math.min(1,300/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PL[k]=c.toDataURL('image/png');$('#pv'+k).src=PL[k];$('#pv'+k).hidden=false};im.src=r.result};r.readAsDataURL(f)}
function ss(e){e.preventDefault();const F=new FormData(e.target),s={};['sekolah','perpus','alamat','kepsek','petugas'].forEach(k=>s[k]=(F.get(k)||'').trim());if(!s.sekolah||!s.perpus){toast('Nama sekolah dan perpustakaan wajib diisi',0);return false}
if(tx(()=>{Object.assign(DB.set,s,PL);lg('Mengubah pengaturan identitas')})){PL={};toast('Pengaturan tersimpan dan terverifikasi');draw()}else toast('GAGAL menyimpan pengaturan',0);return false}
function clr(k){PL[k]='';if(tx(()=>{DB.set[k]='';delete PL[k]})){toast('Logo diatur ulang');draw()}else toast('Gagal',0)}
function bk(){$('#bx').value=JSON.stringify({app:'sip-mustika',v:1,set:DB.set,d:DB.d,log:DB.log});$('#bx').select();toast('Teks cadangan siap. Salin dan simpan di tempat aman.')}
function rs(){let o;try{o=JSON.parse($('#bx').value)}catch(e){return toast('Teks bukan format cadangan yang valid',0)}if(o.app!='sip-mustika'||!o.d)return toast('Format cadangan tidak dikenali',0);cfm('Pulihkan data? Data saat ini akan DITIMPA.',()=>{const ok=tx(()=>{DB.set={...DB.set,...o.set};DB.d=o.d;DB.log=o.log||[]});toast(ok?'Data berhasil dipulihkan':'Gagal memulihkan data',ok);draw()})}
function ra(){cfm('Hapus SEMUA data di aplikasi ini? Pastikan sudah membuat cadangan.',()=>{const ok=tx(()=>{DB.d={};DB.log=[]});toast(ok?'Semua data dihapus':'Gagal menghapus',ok);draw()})}
load();draw();
</script></body></html>
